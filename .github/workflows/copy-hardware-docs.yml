name: Build Product Reference and Hardware Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'README.md'
      - 'hardware/**'
      - 'software/**'
      - 'tools/product-reference/**'
      - '.github/scripts/**'
      - '.github/workflows/copy-hardware-docs.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'hardware/**'
      - 'software/**'
      - 'tools/product-reference/**'
      - '.github/scripts/**'
      - '.github/workflows/copy-hardware-docs.yml'
  workflow_dispatch: # Permite ejecutar manualmente

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-publish-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install document build tools
      run: |
        sudo apt-get update
        sudo apt-get install --yes pandoc fonts-noto-core fonts-noto-mono
        python -m pip install --upgrade pip
        python -m pip install weasyprint

    - name: Build product reference from Markdown
      run: |
        chmod +x tools/product-reference/build.sh
        tools/product-reference/build.sh

    - name: Clean previous documentation
      run: |
        chmod +x .github/scripts/clean_docs.sh
        .github/scripts/clean_docs.sh

    - name: Publish hardware files and product reference under docs/hardware
      run: |
        chmod +x .github/scripts/build_docs.sh
        .github/scripts/build_docs.sh

    - name: Configure GitHub Pages
      if: github.event_name != 'pull_request'
      uses: actions/configure-pages@v5

    - name: Upload GitHub Pages artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-pages-artifact@v4
      with:
        path: docs

    - name: Commit and push changes
      if: github.event_name != 'pull_request' && github.run_attempt == 1
      continue-on-error: true
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add docs/
        if ! git diff --cached --quiet; then
          git commit -m "Auto-update hardware documentation"
          git push
        else
          echo "No changes to commit"
        fi

  deploy-pages:
      if: github.event_name != 'pull_request'
      needs: build-and-publish-docs
      runs-on: ubuntu-latest
      permissions:
        contents: read
        pages: write
        id-token: write
      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}

      steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
