<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">UNIT ATOM TEMT6000 functional block diagram</title>
  <desc id="desc">Ambient light reaches the TEMT6000. Its analog signal is exposed at SIG and sampled by controller PA2. Firmware runs from the internal 24 MHz HSI, averages the ADC value, and publishes it through DDP over I2C. PB5, Flash configuration, and shared factory SWD functions are also shown.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ee6c22"/>
    </marker>
    <style>
      .box { fill: #f3f6f8; stroke: #172536; stroke-width: 2.2; rx: 12; }
      .accent { fill: #fff4ed; stroke: #ee6c22; stroke-width: 2.4; rx: 12; }
      .host { fill: #172536; stroke: #172536; stroke-width: 2.2; rx: 12; }
      .title { fill: #172536; font: 700 22px Arial, sans-serif; text-anchor: middle; }
      .label { fill: #172536; font: 700 18px Arial, sans-serif; text-anchor: middle; }
      .small { fill: #5a6573; font: 15px Arial, sans-serif; text-anchor: middle; }
      .host-label { fill: #ffffff; font: 700 18px Arial, sans-serif; text-anchor: middle; }
      .host-small { fill: #d8dee6; font: 15px Arial, sans-serif; text-anchor: middle; }
      .flow { fill: none; stroke: #ee6c22; stroke-width: 3; marker-end: url(#arrow); }
      .signal { fill: none; stroke: #172536; stroke-width: 2.2; marker-end: url(#arrow); }
      .service { fill: none; stroke: #7a8795; stroke-width: 2; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .rail { fill: none; stroke: #ee6c22; stroke-width: 3; }
      .rail-label { fill: #a93f0b; font: 700 15px Arial, sans-serif; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="648" rx="18" fill="#ffffff" stroke="#d8dee6" stroke-width="2"/>
  <text x="600" y="34" class="title">Functional signal and control paths</text>

  <path d="M120 74 H1120" class="rail"/>
  <path d="M225 74 V170 M490 74 V170 M1005 74 V170 M1120 74 V170" class="rail"/>
  <text x="120" y="67" class="rail-label">VCC / GND power domain</text>

  <rect x="28" y="220" width="130" height="88" class="accent"/>
  <text x="93" y="254" class="label">Ambient</text>
  <text x="93" y="277" class="label">light</text>

  <rect x="180" y="170" width="190" height="138" class="accent"/>
  <text x="275" y="215" class="label">TEMT6000</text>
  <text x="275" y="242" class="small">phototransistor</text>
  <text x="275" y="267" class="small">light → analog signal</text>

  <rect x="420" y="170" width="145" height="138" class="box"/>
  <text x="492" y="213" class="label">PA2 ADC</text>
  <text x="492" y="241" class="small">12-bit sample</text>
  <text x="492" y="266" class="small">0…4095</text>

  <rect x="610" y="170" width="150" height="138" class="box"/>
  <text x="685" y="207" class="label">Acquisition</text>
  <text x="685" y="233" class="small">~20 ms update</text>
  <text x="685" y="258" class="small">1/4/8/16/24</text>
  <text x="685" y="280" class="small">sample average</text>

  <rect x="805" y="170" width="150" height="138" class="accent"/>
  <text x="880" y="210" class="label">DDP 1.0</text>
  <text x="880" y="238" class="small">identity + commands</text>
  <text x="880" y="263" class="small">exact-length replies</text>

  <rect x="990" y="170" width="170" height="138" class="host"/>
  <text x="1075" y="205" class="host-label">I2C host</text>
  <text x="1075" y="232" class="host-small">Qwiic SDA / SCL</text>
  <text x="1075" y="257" class="host-small">7-bit address</text>
  <text x="1075" y="280" class="host-small">100–400 kHz</text>

  <path d="M158 264 H180" class="flow"/>
  <path d="M370 239 H420" class="flow"/>
  <path d="M565 239 H610" class="flow"/>
  <path d="M760 239 H805" class="flow"/>
  <path d="M955 239 H990" class="flow"/>

  <circle cx="395" cy="239" r="6" fill="#ee6c22"/>
  <path d="M395 245 V390 H275" class="signal"/>
  <rect x="175" y="355" width="200" height="72" class="box"/>
  <text x="275" y="385" class="label">Direct SIG contact</text>
  <text x="275" y="408" class="small">host ADC / calibration</text>

  <rect x="620" y="365" width="150" height="78" class="box"/>
  <text x="695" y="395" class="label">Flash config</text>
  <text x="695" y="420" class="small">address · averaging</text>
  <path d="M770 404 H790 V280 H805" class="signal"/>

  <rect x="430" y="355" width="150" height="78" class="box"/>
  <text x="505" y="382" class="label">Internal HSI</text>
  <text x="505" y="405" class="small">24 MHz · no HSE</text>
  <path d="M580 394 H595 V330 H685 V308" class="signal"/>

  <rect x="815" y="470" width="165" height="78" class="accent"/>
  <text x="897" y="500" class="label">PB5 / BUILTIN</text>
  <text x="897" y="525" class="small">relay command block</text>
  <path d="M880 308 V470" class="signal"/>

  <rect x="990" y="340" width="170" height="190" class="box"/>
  <text x="1075" y="372" class="label">Shared service</text>
  <text x="1075" y="394" class="label">pins</text>
  <text x="1075" y="422" class="small">PA10: SDA / SWDIO</text>
  <text x="1075" y="444" class="small">PB6: SCL / SWCLK</text>
  <text x="1075" y="476" class="small">I2C or factory SWD</text>
  <text x="1075" y="498" class="small">mutually exclusive</text>
  <path d="M1075 340 V308" class="service"/>

  <rect x="28" y="570" width="1132" height="48" rx="10" fill="#f3f6f8" stroke="#d8dee6"/>
  <text x="594" y="600" class="small">PA0 and PA1 are reserved with no current application assignment · RESET/SWD are factory-only</text>
</svg>
